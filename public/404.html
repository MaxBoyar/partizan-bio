<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Partizan | מעביר קישור...</title>
    <script>
      (function () {
        var path = window.location.pathname.replace(/\/+$/, '').toLowerCase();
        if (path && path !== '/') {
          window.location.replace('/?r=' + encodeURIComponent(path));
        } else {
          window.location.replace('/');
        }
      })();
    </script>
  </head>
  <body style="background:#030712;color:#e2e8f0;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;">
